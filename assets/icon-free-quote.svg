<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Free roof quote">
  <!-- Soft badge for dark form card -->
  <defs>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#b8c4d4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c14d"/>
      <stop offset="100%" stop-color="#e8a317"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#4a8fc8" stroke-width="2.5" opacity="0.55"/>
  <circle cx="60" cy="60" r="50" fill="#0f1a2e" stroke="#7dd3fc" stroke-width="1.5" opacity="0.9"/>

  <!-- House body -->
  <rect x="34" y="58" width="40" height="28" rx="2" fill="#1a2b4a" stroke="#7dd3fc" stroke-width="1.2"/>
  <!-- Door -->
  <rect x="48" y="68" width="12" height="18" rx="1" fill="#c45c26"/>

  <!-- Metal roof (Colorbond-style chevron) -->
  <path d="M28 60 L54 36 L80 60 Z" fill="url(#roofGrad)" stroke="#c45c26" stroke-width="2" stroke-linejoin="round"/>
  <!-- Roof panel lines -->
  <path d="M40 52 L54 40 L68 52" fill="none" stroke="#1a2b4a" stroke-width="1.2" opacity="0.35"/>
  <path d="M46 56 L54 48 L62 56" fill="none" stroke="#1a2b4a" stroke-width="1" opacity="0.25"/>

  <!-- Small sun peeking -->
  <circle cx="72" cy="34" r="7" fill="url(#sunGrad)"/>
  <g stroke="#e8a317" stroke-width="1.4" stroke-linecap="round">
    <path d="M72 24 V21"/><path d="M80 30 L82 28"/><path d="M80 38 L82 40"/>
    <path d="M64 30 L62 28"/>
  </g>

  <!-- Quote / booking clipboard badge -->
  <g transform="translate(78 62)">
    <rect x="0" y="4" width="26" height="32" rx="3" fill="#ffffff" stroke="#4a8fc8" stroke-width="1.5"/>
    <rect x="6" y="0" width="14" height="8" rx="2" fill="#4a8fc8"/>
    <path d="M6 16 H20 M6 22 H18 M6 28 H16" stroke="#1a2b4a" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <!-- check -->
    <circle cx="20" cy="30" r="7" fill="#c45c26"/>
    <path d="M17 30 L19.5 32.5 L24 27.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
